server {
    listen 80;

    # Same-origin proxy to the backend, so no CORS configuration is needed.
    location /api/ {
        # A literal proxy_pass host is resolved once at startup, and nginx exits if the backend
        # is not yet in DNS. Resolving through a variable defers it to request time, so the
        # container survives any start order or backend restart.
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $upstream_app app:8080;
        proxy_pass http://$upstream_app$request_uri;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
