# Ports are environment-overridable so a local PostgreSQL or another app on 8080 does not
# block startup. Defaults deliberately avoid 5432 and 8080.
services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${CONTRACTGUARD_DB_NAME:-contractguard}
      POSTGRES_USER: ${CONTRACTGUARD_DB_USERNAME:-contractguard}
      POSTGRES_PASSWORD: ${CONTRACTGUARD_DB_PASSWORD:-contractguard}
    ports:
      - "${CONTRACTGUARD_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CONTRACTGUARD_DB_USERNAME:-contractguard} -d ${CONTRACTGUARD_DB_NAME:-contractguard}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - contractguard-db:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      CONTRACTGUARD_DB_URL: jdbc:postgresql://db:5432/${CONTRACTGUARD_DB_NAME:-contractguard}
      CONTRACTGUARD_DB_USERNAME: ${CONTRACTGUARD_DB_USERNAME:-contractguard}
      CONTRACTGUARD_DB_PASSWORD: ${CONTRACTGUARD_DB_PASSWORD:-contractguard}
      # The app binds to loopback by default, which is unreachable from outside the container.
      CONTRACTGUARD_BIND_ADDRESS: 0.0.0.0
    ports:
      - "${CONTRACTGUARD_PORT:-8081}:8080"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - app
    ports:
      - "${CONTRACTGUARD_WEB_PORT:-5173}:80"

volumes:
  contractguard-db:
